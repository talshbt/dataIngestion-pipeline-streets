# ===================================================================
# General Application Properties
# ===================================================================
spring.application.name=dataIngestion-streets


# ===================================================================
# Custom Application Properties
# ===================================================================
# Kafka topic used by both producer and consumer
kafka.topic.streets=streets-topic

# External API Configuration
streets.api.url=https://data.gov.il/api/3/action/datastore_search
streets.api.resourceId=1b14e41c-85b3-4c21-bdce-9fe48185ffca


# ===================================================================
# Kafka General Configuration
# ===================================================================
# Address of the Kafka broker(s)
spring.kafka.bootstrap-servers=localhost:9092


# ===================================================================
# Kafka Producer Configuration (Your existing settings)
# ===================================================================
spring.kafka.producer.retries=0
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# ===================================================================
# Kafka Consumer Configuration (New additions)
# ===================================================================
spring.kafka.consumer.group-id=streets-consumers
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# When a new consumer group starts, read from the beginning of the topic
spring.kafka.consumer.auto-offset-reset=earliest

